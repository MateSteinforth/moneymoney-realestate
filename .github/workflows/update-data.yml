name: Update index data

on:
  schedule:
    # Destatis and GREIX publish quarterly; check weekly so new releases land quickly.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "RealEstateTracker.lua"
      - "tests/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update -q && sudo apt-get install -yq lua5.4

      - name: Build data
        run: python scripts/build_data.py

      - name: Test extension against new data
        run: lua5.4 tests/run.lua

      - name: Commit changes
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update index data ($(python -c 'import json;print(json.load(open("data/indices.json"))["data_through"])'))"
          git push
